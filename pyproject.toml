[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockbuddy-models"
version = "0.4.0"
description = "打分模型资源管理壳子：模型注册表 + 多类型资产下载(权重/源码/工具) + 缓存 + 锁定 + 路径配置（模型数据外部传入，与 DockBuddy 项目解耦）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DockBuddy" }]
keywords = ["protein", "variant-scoring", "models", "weights", "cos", "bioinformatics"]
dependencies = [
    "cos-python-sdk-v5>=1.9.0",
]

[project.optional-dependencies]
hf = ["huggingface-hub>=0.20"]

[project.scripts]
dockbuddy-models = "dockbuddy_models.__main__:main"

[project.urls]
Repository = "https://pypi.cnb.cool/vcinex/bioinfo/-/packages/simple"

[tool.setuptools.packages.find]
include = ["dockbuddy_models*"]
